<!doctype html>
<!--
  The deshrimp business card, from his whiteboard sketch: a curled shrimp, an
  arrow, the same shrimp sitting up, and the address underneath.

  85 x 55 mm trim with 3 mm bleed on every side, so each page is 91 x 61 mm and
  every coordinate below is in millimetres. Keep text 4 mm inside the trim
  (x 7..84, y 7..54). render.cjs turns this into the PDFs and the previews.

  One file, several versions: `card.html?v=<name>` picks a colour scheme and a
  front from the VARIANTS table at the bottom. The back is the same drawing in
  every version and only takes the scheme's colours.

  Colour follows src/ui/DESIGN.md. On slate, the crooked shrimp is the breach,
  so it is the coral one, and the upright shrimp is white ink with the mark's
  coral head. On paper, coral deepens to #E14E1D for strokes as the light theme
  does. On coral, everything turns to slate and white, as mark-on-accent.svg
  does.
-->

<title>deshrimp Visitenkarte</title>
<style>
  @font-face {
    font-family: 'IBM Plex Sans';
    font-weight: 400 700;
    src: url('../../src/ui/fonts/ibm-plex-sans-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    font-weight: 500;
    src: url('../../src/ui/fonts/ibm-plex-mono-500-latin.woff2') format('woff2');
  }

  /* dunkel: the product's own ground */
  :root {
    --ground: #0F172A;
    --ink: #F8FAFC;
    --ink-2: #94A3B8;
    --rule: #334155;
    --curled: #ff8257;
    --upright: #F8FAFC;
    --eye: #ff8257;
    --arrow: #94A3B8;
    --mark: #F8FAFC;
    --dot: #ff8257;
  }
  /* hell: the light theme's ladder, with the brand's logo-inverse colours */
  :root[data-scheme="hell"] {
    --ground: #F8FAFC;
    --ink: #1E293B;
    --ink-2: #475569;
    --rule: #CBD5E1;
    --curled: #E14E1D;
    --upright: #1E293B;
    --eye: #E14E1D;
    --arrow: #475569;
    --mark: #0F172A;
    --dot: #ff8257;
  }
  /* koralle: the accent as the ground, as mark-on-accent.svg */
  :root[data-scheme="koralle"] {
    --ground: #ff8257;
    --ink: #0F172A;
    --ink-2: #0F172A;
    --rule: #0F172A;
    --curled: #0F172A;
    --upright: #FFFFFF;
    --eye: #0F172A;
    --arrow: #0F172A;
    --mark: #FFFFFF;
    --dot: #FFFFFF;
  }

  @page { size: 91mm 61mm; margin: 0; }
  html, body { margin: 0; padding: 0; background: var(--ground); }
  .page {
    width: 91mm;
    height: 61mm;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }
  svg { display: block; width: 91mm; height: 61mm; }

  .front { display: none; }
  :root[data-front="lucide"] .front-lucide,
  :root[data-front="messwert"] .front-messwert,
  :root[data-front="pair"] .front-pair { display: block; }

  .sans { font-family: 'IBM Plex Sans', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .label { text-transform: uppercase; letter-spacing: 0.09em; }

  /* Trim and safe area, drawn only for the on-screen proof (render.cjs --guides). */
  .guides { display: none; }
  .show-guides .guides { display: inline; }
</style>

<script>
  // name: [colour scheme, front, curled, upright]. render.cjs reads this table
  // too. The last two only matter for the "pair" front.
  var VARIANTS = {
    dunkel:    ['dunkel', 'lucide'],
    hell:      ['hell', 'lucide'],
    koralle:   ['koralle', 'lucide'],
    messwert:  ['dunkel', 'messwert'],
    iconpark:  ['dunkel', 'pair', 'c-iconpark', 'up-iconpark'],
    hugeicons: ['dunkel', 'pair', 'c-hugeicons', 'up-hugeicons'],
    meteor:    ['hell', 'pair', 'c-meteor', 'up-meteor'],
    noto:      ['dunkel', 'pair', 'c-noto', 'up-noto'],
  };
  var v = VARIANTS[new URLSearchParams(location.search).get('v')] || VARIANTS.dunkel;
  document.documentElement.dataset.scheme = v[0];
  document.documentElement.dataset.front = v[1];

  // Scales a pair to one factor, so both shrimp keep the same line weight,
  // then stands both on the baseline at y 41: the curled one centred on
  // x 23, at most 22 x 24, the upright one on x 71, at most 19 x 29. getBBox
  // leaves the line width out, so the frames are smaller than the safe area
  // by about a stroke.
  function fitPair(curledId, uprightId) {
    var c = document.querySelector('.pair-curled');
    var u = document.querySelector('.pair-upright');
    c.setAttribute('href', '#' + curledId);
    u.setAttribute('href', '#' + uprightId);
    var bc = c.getBBox(), bu = u.getBBox();
    var k = Math.min(22 / bc.width, 24 / bc.height, 19 / bu.width, 29 / bu.height);
    [[c, bc, 23], [u, bu, 71]].forEach(function (e) {
      var tx = e[2] - (e[1].x + e[1].width / 2) * k;
      var ty = 41 - (e[1].y + e[1].height) * k;
      e[0].setAttribute('transform', 'translate(' + tx + ' ' + ty + ') scale(' + k + ')');
    });
  }
  if (v[1] === 'pair') fitPair(v[2], v[3]);
</script>
