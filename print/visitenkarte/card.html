<!doctype html>
<!--
  The deshrimp business card, from his whiteboard sketch: a curled shrimp, an
  arrow, the same shrimp sitting up, and the address underneath.

  85 x 55 mm trim with 3 mm bleed on every side, so each page is 91 x 61 mm and
  every coordinate below is in millimetres. Keep text 4 mm inside the trim
  (x 7..84, y 7..54). render.cjs turns this into the PDF and the two previews.

  Colour follows src/ui/DESIGN.md: slate ground, white ink, slate-blue
  secondary, and the coral accent only where the severity ladder puts it. The
  crooked shrimp is the breach, so it is the coral one; the upright shrimp is
  white ink with the mark's coral head.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>deshrimp Visitenkarte</title>
<style>
  @font-face {
    font-family: 'IBM Plex Sans';
    font-weight: 400 700;
    src: url('../../src/ui/fonts/ibm-plex-sans-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    font-weight: 500;
    src: url('../../src/ui/fonts/ibm-plex-mono-500-latin.woff2') format('woff2');
  }

  :root {
    --ground: #0F172A;
    --ink: #F8FAFC;
    --ink-2: #94A3B8;
    --accent: #ff8257;
  }

  @page { size: 91mm 61mm; margin: 0; }
  html, body { margin: 0; padding: 0; background: var(--ground); }
  .page {
    width: 91mm;
    height: 61mm;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }
  svg { display: block; width: 91mm; height: 61mm; }

  .sans { font-family: 'IBM Plex Sans', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .label { text-transform: uppercase; letter-spacing: 0.09em; }

  /* Trim and safe area, drawn only for the on-screen proof (render.cjs --guides). */
  .guides { display: none; }
  .show-guides .guides { display: inline; }
</style>
</head>
<body>

<!-- Front: the sketch -->
<div class="page">
<svg viewBox="0 0 91 61" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Eine gekrümmte Garnele, ein Pfeil, dieselbe Garnele aufrecht. deshrimp.com">
  <rect width="91" height="61" fill="var(--ground)" />

  <!--
    Both shrimp are Lucide's `shrimp` icon on its 24-unit grid (licence in
    LICENSE-lucide.txt). The curled one is the icon as published; the upright
    one keeps its head and antenna path and straightens the body, on a grid
    8 units taller. Both are scaled alike, so the lines match, and they stand
    on one baseline: sitting up is what makes the second one taller.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <!-- crooked: the breach, so coral -->
    <g transform="translate(11 17.2) scale(1.05)" stroke="var(--accent)">
      <path d="M10 2a3.28 3.28 0 003.227 1.798l6.17-.561A1 1 0 1119.614 8H8.5a6.44 6.44 0 00-5.63 9.75A6.5 6.5 0 008.5 21c1.38 0 2-.5 2.5-1" />
      <path d="M10 8a8.5 8.5 0 000 8" />
      <path d="M11 22c-.5-.5-1.12-1-2.5-1a1 1 0 010-5H12a7 7 0 007-7V8" />
      <path d="M13 12h.01" />
      <path d="M8 16c-2 0-4.5-4-4-6" />
    </g>

    <!-- the arrow, in secondary ink: it is the explanation, not the subject -->
    <path d="M40 28h9v-4.6l7.4 6.6-7.4 6.6V32h-9z" stroke="var(--ink-2)" stroke-width="0.9" />

    <!-- upright: within tolerance, so white ink, with the mark's coral head -->
    <g transform="translate(58.9 10) scale(1.05)" stroke="var(--ink)">
      <path d="M10 2a3.28 3.28 0 003.227 1.798l6.17-.561A1 1 0 1119.614 8H8.5A2.5 2.5 0 006 10.5V17c0 4 1.5 7.5 4 8.5" />
      <path d="M14 8v9c0 4-1.5 7.5-4 8.5" />
      <path d="M6 13c2.6 1 5.4 1 8 0" />
      <path d="M6.4 18.5c2.4.9 4.8.9 7.2 0" />
      <path d="M10 25.5c0 1.4-.5 2.2-1.6 3" />
      <path d="M10 25.5c0 1.4.5 2.2 1.6 3" />
      <path d="M14 12c1.6 0 3.2 1.2 3.8 3" />
      <path d="M14 16c1.6 0 3.2 1.2 3.8 3" />
      <path d="M11 10.6h.01" stroke="var(--accent)" />
    </g>
  </g>

  <text x="45.5" y="53" text-anchor="middle" class="sans"
        font-size="4.6" font-weight="700" letter-spacing="-0.12" fill="var(--ink)">deshrimp<tspan fill="var(--ink-2)" font-weight="400">.com</tspan></text>

  <g class="guides" fill="none" stroke-width="0.15">
    <rect x="3" y="3" width="85" height="55" stroke="#00FFFF" />
    <rect x="7" y="7" width="77" height="47" stroke="#FF00FF" stroke-dasharray="0.8 0.8" />
  </g>
</svg>
</div>

<!-- Back: the logo and what it is -->
<div class="page">
<svg viewBox="0 0 91 61" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="deshrimp. Sitz aufrecht du Garnele! deshrimp.com">
  <rect width="91" height="61" fill="var(--ground)" />

  <!-- the mark from public/brand/mark.svg, geometry copied, at 48 units = 14 mm -->
  <g transform="translate(15.5 15.5) scale(0.2917)">
    <rect x="20" y="38" width="14" height="4" rx="2" fill="var(--ink)" />
    <rect x="15" y="30" width="14" height="4" rx="2" fill="var(--ink)" />
    <rect x="12" y="22" width="14" height="4" rx="2" fill="var(--ink)" />
    <rect x="14" y="14" width="14" height="4" rx="2" fill="var(--ink)" />
    <circle cx="27" cy="8" r="3.5" fill="var(--accent)" />
  </g>
  <text x="32" y="26.6" class="sans" font-size="9.9" font-weight="700"
        letter-spacing="-0.29" fill="var(--ink)">deshrimp</text>

  <text x="32" y="33.6" class="sans" font-size="3.3" font-weight="400"
        fill="var(--ink-2)">„Sitz aufrecht du Garnele!“</text>

  <line x1="7" y1="44.4" x2="84" y2="44.4" stroke="#334155" stroke-width="0.25" />

  <text x="7" y="51.4" class="sans label" font-size="2.1" font-weight="500"
        fill="var(--ink-2)">Haltung · im Browser · ohne Konto</text>
  <text x="84" y="51.4" text-anchor="end" class="sans" font-size="3.1" font-weight="600"
        fill="var(--ink)">deshrimp.com</text>

  <g class="guides" fill="none" stroke-width="0.15">
    <rect x="3" y="3" width="85" height="55" stroke="#00FFFF" />
    <rect x="7" y="7" width="77" height="47" stroke="#FF00FF" stroke-dasharray="0.8 0.8" />
  </g>
</svg>
</div>

</body>
</html>
