<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="deshrimp">
  <!--
    The deshrimp mark: a vertebral stack of four white bars on a forward curve
    with a marker at the head. Geometry taken from the design system's
    brand/mark.svg, laid on the coral of the palette and scaled into the
    maskable safe zone (the inner 80%) so a platform that crops to a circle
    keeps all of it. The marker is the ink, because the coral is the plate.
    The credentialed original of the mark is served alongside this file at
    brand/mark.svg.
  -->
  <title>deshrimp</title>
  <rect width="512" height="512" rx="96" fill="#E29A86"/>
  <g transform="translate(59.8 57.7) scale(8.53)">
    <rect x="20" y="38" width="14" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="15" y="30" width="14" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="12" y="22" width="14" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="14" y="14" width="14" height="4" rx="2" fill="#FFFFFF"/>
    <circle cx="27" cy="8" r="3.5" fill="#1A1A1A"/>
  </g>
</svg>
