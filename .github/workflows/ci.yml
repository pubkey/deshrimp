name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `npm install` must run scripts: `postinstall` fetches the pose model into
      # `public/mp/`, which the build expects to exist.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests if configured
        run: npm run --if-present test
