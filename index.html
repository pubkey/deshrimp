<!doctype html>
<!-- The palette is locked: one accent, a light theme and its dark twin
     (src/ui/DESIGN.md). The theme is a choice, restored from localStorage
     before the first render so the page does not flash the wrong one. Light
     is the default; dark follows the system until someone presses the toggle. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>deshrimp - free webcam posture trainer for your desk</title>
    <meta name="description" content="A free page that watches your posture through your webcam and makes a noise when you fold up. The pictures and the readings stay on your device. No install, no account." />
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare's snippet as given, single quotes and all: the legal notice
         drops every module script and refuses to build with one left, matching
         on double quotes, so with those the beacon would fail the build. -->
    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "e7e5f8394b734d86a9484695a73e2702"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
