<!doctype html>
<!-- data-accent picks the palette out of src/ui/theme.css; the theme itself
     (light/dark) is restored from localStorage before the first render. -->
<html lang="en" data-accent="shrimp-calm">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>deshrimp — free webcam posture trainer for your desk</title>
    <meta name="description" content="A free page that watches your posture through your webcam and makes a noise when you fold up. Nothing leaves your device. No install, no account." />
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
